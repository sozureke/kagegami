root:
  short: Pentest recon assistant for your terminal
  long: |-
    Kagegami watches the output of the commands you run, keeps a map of the
    target and an engagement journal, and suggests the next step.

commands:
  init:
    short: Create the configuration (and optionally a case)
  watch:
    short: Open the side panel next to your terminal (tmux)
    long: |-
      The side panel: one stream of what you run and what Kagegami made of it, with the map, the
      pipeline and the help one key away (m, p, ?).

      The panel that watches your shell in a tmux split is not ready yet. For now:

          kagegami watch --demo

      plays a made-up session in this terminal, so that the look and the keys can be tried.
      Press n for a (made-up) suggestion, q to quit.
  hook:
    short: Print the shell hook that lets Kagegami see where commands start and end
    long: |-
      Print the hook for your shell (zsh). Add this line to your shell's startup file:

          eval "$(kagegami hook zsh)"

      The hook prints invisible markers around each command while Kagegami watches the
      pane, and does nothing otherwise.
  next:
    short: Suggest the next recon step
    long: |-
      Ask the model that reasons over the whole map (tier 2, model.tier2 in the config) for
      one recon command, with why it matters, what to expect and its risk.

          kagegami next
          kagegami next "focus on the web server"

      The command is checked against the case's scope before it is shown: it never names an
      address outside it, and it is never run for you. The case needs a scope first (see
      kagegami case set). --json prints the suggestion as JSON.
  pipeline:
    short: Lay out a pipeline for the whole target
    long: |-
      Ask tier 2 to read the whole map and order what is worth doing next, with why each
      step matters. Every run is saved as a new, numbered version.

          kagegami pipeline
          kagegami pipeline --history
          kagegami pipeline --show 3

      A step about a service that is not on the map, or a command outside the case's
      scope, is left out and listed as dropped, not shown to the model again. --json prints
      the pipeline (or, with --history/--show, the saved runs) as JSON.
  report:
    short: Generate the Markdown report
  map:
    short: Show the target map
    long: |-
      Print the map of a case: hosts, their services, the web paths found on them,
      findings, credentials (always masked) and the agent's notes.

      Closed ports, long path lists and old notes are folded; --all shows everything.
      --stats adds the tokens the models have used. --json prints the whole map as JSON.
      The command only reads the case.
  case:
    short: Set or show what a case is about (target, goal, scope)
    long: |-
      A case remembers what the engagement is about. The scope in it is the boundary of
      everything Kagegami does: addresses outside it are kept off the map, and next and
      pipeline only suggest what is inside it.
  case set:
    short: Set the target, goal, scope, rules or phase of a case
    long: |-
      Change what a case is about; what you do not give stays as it is.

      The scope says what may be touched. Give an address, a network or a range, and repeat
      the flag for more than one:

          kagegami case set --target 10.10.10.5 --goal "user and root flag"
          kagegami case set --scope 10.10.10.0/24 --scope 10.10.20.5-10.10.20.9
          kagegami case set --add-scope 192.168.1.50

      --scope replaces the scope, --add-scope adds to it. If the scope is empty and the
      target is an address or a network, the scope becomes the target.
  case show:
    short: Show what a case is about
  version:
    short: Print version information
