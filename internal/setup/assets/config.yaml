# Kagegami configuration. Every key is optional: anything you leave out keeps
# the default shown here. Unknown keys are an error, so typos are caught early.

model:
  # You choose the models. Write them as provider/model; for now the provider is "ollama",
  # and the model is any you have pulled (see `ollama list`).
  #
  # tier1 reads the output of commands that Kagegami has no parser for and puts what it finds
  # (hosts, ports, paths) on the map. The task is narrow, so a small, fast model is enough.
  tier1: ollama/llama3.1:8b
  # tier2 answers `next` and `pipeline`: it reasons over the whole map. Leave it empty to let
  # tier1 do both, or name a larger model for better advice, for example ollama/qwen2.5:14b.
  tier2: ""
  cloud_fallback: false

providers:
  ollama:
    # Where Ollama runs. The default is this machine. Command output is sent to this address,
    # so any other address counts as remote and its data is masked like data sent to a cloud.
    base_url: http://localhost:11434

limits:
  # The most tokens the models may use in one run. At the ceiling they stop and what has been
  # collected is kept; the output of commands is still recorded. 0 means no ceiling.
  session_tokens: 1000000

privacy:
  mask_credentials: true # credentials and hashes become ••• before anything leaves your machine
  mask_flags: true
  mask_hosts: false

execution:
  mode: propose # propose | approve-run
  confirm_destructive: true

engagement:
  scaffold_folders: true
  auto_report: true
  report_template: "" # empty means <config dir>/templates/pentest.md
  author: "" # name for "Prepared by" in the report

# Per-phase hints for the model, for example:
# phases:
#   recon:
#     emphasis: "full information gathering, synthesis into a pipeline"
#   web:
#     emphasis: "curl/ffuf/httpx, no browser"

capture:
  trigger: shell-hooks # shell-hooks | pipe-pane
  ignore: [cd, ls, clear, pwd] # commands that never trigger reasoning

logging:
  level: info # debug | info | warn | error

# The opening animation, played when the panel starts. Settle it once here and forget it: try a
# change with `kagegami splash` (add --loop to watch it again and again). The art itself is the
# file internal/splash/assets/art.txt in the source; it is shrunk to fit the terminal on its own.
splash:
  enabled: true # false skips the animation at start; `kagegami splash` still plays it
  scale: 1 # 1 keeps the size of the art, 0.5 halves it; it is never enlarged
  fit: true # also shrink the art until it fits the terminal; false crops what does not fit
  color: chrome # metallic white shading; or a hex colour (#eceef2), or green | white | magenta | cyan
  mode: fade # fade | decode: how a character appears
  speed: 1.5 # time multiplier of the appearance and the pulses; higher is faster
  fps: 24 # frames per second; higher is smoother and costs more CPU while it plays
  rings: 4 # rings the art appears in, from the centre out; more is a finer ripple
  pulse: 8 # pause between rings, in frames
  fade: 22 # frames a character takes to appear; 1 is a hard cut
  jitter: 3 # random spread of each character's start, in frames
  center_x: 50 # centre of the rings and pulses, % of the art's width
  center_y: 50 # and of its height
  pulse_freq: 25 # how often a pulse starts after the art has appeared, 0-100
  pulse_speed: 25 # how fast a pulse travels
  pulse_width: 30 # thickness of a pulse, in tenths of a cell
  glitch: 70 # amount of glitching, 0-100; 0 turns it all off
  rgb_split: 40 # how often a glitching row shows red and cyan ghosts, 0-100
  scanlines: true # darken every second row
  vignette: true # darken towards the edges
  cell_aspect: 0.5 # width / height of a terminal cell; raise it if rings look like upright ovals
  fade_out_sec: 1.5 # seconds the art takes to dissolve
  hold_sec: 4 # seconds the finished art glitches before it dissolves
  total_max_sec: 8 # the longest the whole animation may last
  loop: false # play again when it ends, until a key is pressed
  seed: 0 # a non-zero seed repeats the same frames; 0 is random each time
