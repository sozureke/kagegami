name: Feature request
description: Suggest an idea or an improvement
labels: ["type/feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Kagegami to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal capture / shell hooks
        - Parsers (tool output)
        - Target map / storage
        - Model layer
        - Side panel (TUI)
        - Report
        - CLI / configuration
        - Other
